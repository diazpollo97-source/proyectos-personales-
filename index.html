<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Carta para ti 💌</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial, Helvetica, sans-serif;
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,#ff9ecf,#ffc6e6,#ffe6f5);
  overflow:hidden;
}

/* CONTENEDOR */
.container{
  position:relative;
  width:320px;
  height:220px;
  perspective:1200px;
}

/* SOBRE */
.envelope{
  position:absolute;
  width:100%;
  height:100%;
  background:#ff4d88;
  border-radius:10px;
  cursor:pointer;
  box-shadow:0 20px 50px rgba(0,0,0,0.35);
  display:flex;
  align-items:center;
  justify-content:center;
  color:white;
  font-size:22px;
  transform-style:preserve-3d;
  transition:transform 1s;
}

/* TAPA */
.flap{
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:50%;
  background:#ff2e7a;
  clip-path:polygon(0 0,100% 0,50% 100%);
  transform-origin:top;
  transition:transform 1s;
}

/* CARTA */
.letter{
  position:absolute;
  top:20px;
  left:10px;
  width:300px;
  height:380px;
  background:white;
  border-radius:12px;
  padding:20px;
  text-align:center;
  box-shadow:0 15px 40px rgba(0,0,0,0.3);
  transform:translateY(120px);
  opacity:0;
  transition:1s;
}

.letter h1{
  color:#ff2e7a;
}

/* FOTO */
.letter img{
  width:180px;
  border-radius:10px;
  margin-top:10px;
  box-shadow:0 10px 20px rgba(0,0,0,0.2);
  animation:flotar 3s ease-in-out infinite;
}

@keyframes flotar{
  0%{transform:translateY(0);}
  50%{transform:translateY(-12px);}
  100%{transform:translateY(0);}
}

/* ABIERTO */
.open .flap{
  transform:rotateX(180deg);
}

.open .letter{
  transform:translateY(-140px);
  opacity:1;
}

.open .envelope{
  transform:rotateX(20deg) rotateY(-10deg) scale(1.05);
}

/* CORAZONES */
.heart{
  position:fixed;
  top:-20px;
  font-size:22px;
  animation:fall 6s linear infinite;
}

/* FLORES */
.flor{
  position:fixed;
  top:-50px;
  font-size:24px;
  pointer-events:none;
  animation:fall 6s linear forwards;
}

/* BRILLO */
.brillo{
  position:fixed;
  width:8px;
  height:8px;
  background:white;
  border-radius:50%;
  box-shadow:0 0 15px white,0 0 30px white;
  pointer-events:none;
  animation:brillar 3s linear forwards;
}

@keyframes brillar{
  0%{
    opacity:0;
    transform:scale(0);
  }
  50%{
    opacity:1;
    transform:scale(1);
  }
  100%{
    opacity:0;
    transform:scale(0);
  }
}

.explosion{
  position:fixed;
  font-size:24px;
  pointer-events:none;
  animation:boom 1.5s ease-out forwards;
}

@keyframes boom{
  0%{
    transform:translate(0,0) scale(0);
    opacity:1;
  }

  100%{
    transform:translate(var(--x),var(--y)) scale(1.5);
    opacity:0;
  }
}


</style>
</head>

<body>

<div class="container" id="container">

<div class="envelope" onclick="abrir()">
💌 Haz click
<div class="flap"></div>
</div>

<div class="letter">
<h1>Para ti 💖</h1>
<p id="texto"></p>
<img src="./pollito.png">
</div>

</div>

<audio id="music" loop>
<source src="in-the-sea.mp3" type="audio/mpeg">
</audio>

<script>

let mensaje="Quería decirte que eres una persona muy especial para mí. Tu amistad significa mucho y me alegra compartir momentos contigo. Gracias por ser tan increíble.";
let i=0;

function abrir(){
  document.getElementById("container").classList.add("open");
  document.getElementById("music").play();
  explosion();
  escribir();
}

function escribir(){
if(i < mensaje.length){
document.getElementById("texto").innerHTML += mensaje.charAt(i);
i++;
setTimeout(escribir,35);
}
}

/* CORAZONES */
function heart(){
const h=document.createElement("div");
h.classList.add("heart");
h.innerHTML="💖";
h.style.left=Math.random()*100+"vw";
document.body.appendChild(h);

setTimeout(()=>{h.remove();},6000);
}
setInterval(heart,400);

/* FLORES */
function flor(){
  const f=document.createElement("div");
  f.className="flor";
  f.innerHTML="🌸";

  f.style.left=Math.random()*100+"vw";

  document.body.appendChild(f);

  setTimeout(function(){
    f.remove();
  },6000);
}
setInterval(flor,800);

/* explocion */
function explosion(){

  const rect=document.querySelector(".container").getBoundingClientRect();

  for(let i=0;i<25;i++){

    const c=document.createElement("div");
    c.className="explosion";
    c.innerHTML="💖";

    const x=(Math.random()-0.5)*400+"px";
    const y=(Math.random()-0.5)*400+"px";

    c.style.setProperty("--x",x);
    c.style.setProperty("--y",y);

    c.style.left=rect.left + rect.width/2 + "px";
    c.style.top=rect.top + rect.height/2 + "px";

    document.body.appendChild(c);

    setTimeout(()=>{
      c.remove();
    },1500);

  }

}
  
/* BRILLO */
function brillo(){

  const b=document.createElement("div");
  b.className="brillo";

  b.style.left=Math.random()*100+"vw";
  b.style.top=Math.random()*100+"vh";

  document.body.appendChild(b);

  setTimeout(()=>{
    b.remove();
  },3000);

}
  

setInterval(brillo,200);
</script>

</body>
</html>
